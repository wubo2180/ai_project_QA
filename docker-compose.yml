services:
  backend:
    build: ./backend
    container_name: ai_qa_backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    # 如需直接访问后端可放开端口映射
    ports:
      - "8000:8000"
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 2G
    #     reservations:
    #       cpus: "0.5"
    #       memory: 512M

  frontend:
    build: ./frontend
    container_name: ai_qa_frontend
    depends_on:
      - backend
    ports:
      - "8007:80"
    restart: unless-stopped
