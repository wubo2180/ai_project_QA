services:
  backend:
    build: ./backend
    container_name: ai_qa_backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    # 如需直接访问后端可放开端口映射
    # ports:
    #   - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai_qa_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
